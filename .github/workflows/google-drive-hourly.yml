name: Copia diaria para o Google Drive

on:
  schedule:
    # GitHub Actions usa UTC; 04:00 UTC = 01:00 em Brasilia.
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  enviar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar cliente Google Drive
        run: pip install google-api-python-client google-auth

      - name: Enviar arquivo atual
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
        run: python .github/scripts/upload_to_drive.py backups/ots_otd_latest.json

      - name: Alertar falha do backup
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Falha no backup OTS/OTD';
            const body = [
              'Uma etapa do processo de backup não foi concluída.',
              '',
              `Workflow: ${context.workflow}`,
              `Execução: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              'Verifique os Secrets GOOGLE_SERVICE_ACCOUNT_JSON e GOOGLE_DRIVE_FOLDER_ID e execute novamente após corrigir.'
            ].join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body
            });
